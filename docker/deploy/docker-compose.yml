version: '3'

services:
  web: &web
    build:
      context: .
      dockerfile: docker/development/Dockerfile.slim
    volumes:
      - bundler:/usr/local/bundle
      - /usr/src/app/tmp/pids
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    links:
      - db
      - redis
    depends_on:
      - db
      - redis
    environment:
      RAILS_REDIS_HOST: redis
      RAILS_REDIS_PORT: 6379
    tty: true
    stdin_open: true

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  db:
    image: mariadb
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - db:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"

  nginx:
    build:
      context: .
      dockerfile: docker/deploy/nginx/Dockerfile
    ports:
      - 80:80
    links:
      - web

volumes:
  bundler: {}
  node_modules: {}
  db: {}
