upstream puma {
  server web:3000;
}

server {
  listen  80;
  server_name oreno-webpush.medpeer.jp;

  # https 接続永続化
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ELB到達がHTTPだった場合、HTTPにリダイレクトする
  if ($http_x_forwarded_proto != https) {
    set $to_https  A;
  }
  if ($http_user_agent !~* ELB-HealthChecker) {
    set $to_https  "${to_https}B";
    set $direct_ip A;
  }
  if ($to_https = AB) {
    return 301 https://$host$request_uri;
  }
  if ($host !~* oreno-webpush.medpeer.jp) {
    set $direct_ip "${direct_ip}B";
  }
  # 直IPの場合は redirect
  if ($direct_ip = AB) {
    return 444;
  }

  charset utf-8;
  client_max_body_size 20M;
  server_tokens off;
  root /work/app/public;

  proxy_set_header Host               $host;
  proxy_set_header X-Client-IP        $remote_addr;
  proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host   $host;
  proxy_set_header X-Forwarded-Server $host;
  proxy_set_header X-Forwarded-Proto  https;

  limit_conn lcz 30;
  limit_req zone=lrz burst=200 nodelay;
  limit_req_status 503;

  set_real_ip_from  172.31.0.0/16;
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  access_log /var/log/nginx/access.log ltsv;

  location = /healthcheck.html {
    empty_gif;
    access_log  off;
    break;
  }

  location ~* ^/assets/ {
    gzip_static on;

    # Per RFC2616 - 1 year maximum expiry
    expires 1y;
    add_header Cache-Control public;

    add_header Last-Modified "";
    add_header ETag "";

    if (-f $request_filename) {
      break;
    }

    try_files $uri $uri/index.html $uri.html @assets;
  }

  location / {
    gzip_static on;
    try_files $uri $uri/index.html $uri.html @app;
  }

  location @app {
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_redirect     off;

    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-Ssl   on;

    proxy_pass http://puma;
  }

  location @assets {
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_redirect     off;

    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-Ssl   on;

    proxy_cache cache-space;
    proxy_cache_valid  200 302  60m;

    proxy_pass http://puma;
  }
}
